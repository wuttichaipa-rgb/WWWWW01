<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็คชื่อเข้าเรียนด้วยตัวเอง</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Prompt', sans-serif;
        }
    </style>
</head>
<body class="bg-green-50 min-h-screen py-8 px-4">

    <div class="max-w-2xl mx-auto">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-green-800 mb-2">Student Self Check-In</h1>
            <p class="text-green-600">ระบบเช็คชื่อเข้าเรียนด้วยตัวเองสำหรับนักศึกษา</p>
        </div>

        <div class="bg-white rounded-2xl shadow-xl p-6 mb-8 border border-green-100">
            <h2 class="text-xl font-semibold text-green-700 mb-4 flex items-center gap-2">
                📝 กรอกข้อมูลเพื่อเช็คชื่อ
            </h2>
            
            <form id="checkInForm" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อวิชา</label>
                        <input type="text" id="subject" required class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition" placeholder="เช่น เทคโนโลยีสารสนเทศ">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">ชื่ออาจารย์ผู้สอน</label>
                        <input type="text" id="teacher" required class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition" placeholder="เช่น ดร.สมชาย ใจดี">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">รหัสนักศึกษา</label>
                        <input type="text" id="studentId" required class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition" placeholder="เช่น 6401020304">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อ-นามสกุล</label>
                        <input type="text" id="studentName" required class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition" placeholder="เช่น นายสมศักดิ์ รักเรียน">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ห้องเรียน / ชั้นเลขที่</label>
                    <input type="text" id="room" required class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition" placeholder="เช่น ห้อง 402 ชั้น 4">
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-3 px-4 rounded-lg shadow-md transition-all duration-200 transform hover:-translate-y-0.5 active:translate-y-0 flex justify-center items-center gap-2">
                    <span>📌 บันทึกเวลาเข้าเรียน</span>
                </button>
            </form>
        </div>

        <div class="bg-white rounded-2xl shadow-xl p-6 border border-green-100">
            <h2 class="text-xl font-semibold text-green-700 mb-4 flex items-center gap-2">
                📋 ประวัติการเช็คชื่อล่าสุด (ในเซสชั่นนี้)
            </h2>
            
            <div id="logsContainer" class="space-y-4">
                <p id="noDataText" class="text-gray-400 text-center py-6">ยังไม่มีประวัติการเช็คชื่อในขณะนี้</p>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-5 right-5 bg-gray-900 text-white px-6 py-3 rounded-xl shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-2">
        <span id="toastIcon"></span>
        <span id="toastMessage"></span>
    </div>

    <script>
        // 🛑 นำ URL ของ Web App จาก Google Apps Script ที่ได้มาใส่ในช่องนี้ 🛑
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxJTbFqvL0jhLUgE7NQ8NGQe1ilhoeWzq0HWKaehLApJSf4WYAJzafQwMq4Np1w4GOV/exec";

        const form = document.getElementById('checkInForm');
        const submitBtn = document.getElementById('submitBtn');
        const logsContainer = document.getElementById('logsContainer');
        const noDataText = document.getElementById('noDataText');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // เช็คว่ากรอก URL หรือยัง
            if(WEB_APP_URL.includes("ใส่_URL_APPS_SCRIPT")) {
                showToast("❌ กรุณาใส่ URL Apps Script ในโค้ดก่อนใช้งาน!", "error");
                return;
            }

            // เปลี่ยนสถานะปุ่มโหลด
            submitBtn.disabled = true;
            submitBtn.innerHTML = `
                <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>กำลังบันทึกข้อมูล...</span>
            `;

            // ดึงค่าจากฟอร์ม
            const formData = {
                subject: document.getElementById('subject').value,
                teacher: document.getElementById('teacher').value,
                studentId: document.getElementById('studentId').value,
                studentName: document.getElementById('studentName').value,
                room: document.getElementById('room').value
            };

            try {
                // ส่งข้อมูลไปยัง Google Apps Script
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors', // จำเป็นสำหรับการข้ามโดเมนของ Apps Script แบบง่าย
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                // เนื่องจากโหมด no-cors จะไม่คืนค่า Json กลับมาตรงๆ หน้าเว็บจะจำลองข้อมูลเพื่อแสดงเป็น Log ทันที
                const autoTimestamp = new Date().toLocaleString('th-TH', { timeZone: 'Asia/Bangkok' });
                
                // แสดงผลลัพธ์ลงในการ์ดสรุปด้านล่าง
                addLogToSummary(formData, autoTimestamp);
                showToast("✅ เช็คชื่อเข้าเรียนสำเร็จ!", "success");
                
                // ล้างค่าฟอร์มในส่วนของนักศึกษา (ส่วนวิชาค้างไว้เพื่อความสะดวกกรณีเรียนวิชาเดิม)
                document.getElementById('studentId').value = '';
                document.getElementById('studentName').value = '';

            } catch (error) {
                console.error(error);
                showToast("❌ เกิดข้อผิดพลาดในการส่งข้อมูล", "error");
            } finally {
                // คืนค่าปุ่มเดิม
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>📌 บันทึกเวลาเข้าเรียน</span>`;
            }
        });

        // ฟังก์ชันสร้างการ์ดแสดงผลลัพธ์
        function addLogToSummary(data, timestamp) {
            if (noDataText) noDataText.remove();

            const logCard = document.createElement('div');
            logCard.className = "bg-green-50/70 border border-green-200 rounded-xl p-4 shadow-sm transition-all hover:shadow-md relative overflow-hidden";
            logCard.innerHTML = `
                <div class="absolute top-0 left-0 w-1.5 h-full bg-green-500"></div>
                <div class="flex justify-between items-start mb-2">
                    <span class="text-xs bg-green-200 text-green-800 font-medium px-2 py-1 rounded-md">${timestamp}</span>
                    <span class="text-sm font-semibold text-green-700">${data.room}</span>
                </div>
                <div class="grid grid-cols-2 gap-y-2 gap-x-4 text-sm mt-3">
                    <div><span class="text-gray-500">วิชา:</span> <span class="font-medium text-gray-800">${data.subject}</span></div>
                    <div><span class="text-gray-500">อาจารย์:</span> <span class="font-medium text-gray-800">${data.teacher}</span></div>
                    <div><span class="text-gray-500">รหัสนักศึกษา:</span> <span class="font-medium text-gray-800">${data.studentId}</span></div>
                    <div><span class="text-gray-500">ชื่อ-สกุล:</span> <span class="font-medium text-gray-800">${data.studentName}</span></div>
                </div>
            `;
            
            // นำ Log ใหม่ขึ้นไปแสดงด้านบนสุดของรายการ
            logsContainer.insertBefore(logCard, logsContainer.firstChild);
        }

        // ฟังก์ชัน Toast สำหรับแจ้งเตือนแบบสวยงาม
        function showToast(message, type) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            toastMessage.textContent = message;
            
            if(type === 'success') {
                toast.className = "fixed bottom-5 right-5 bg-green-600 text-white px-6 py-3 rounded-xl shadow-2xl transform opacity-100 transition-all duration-300 flex items-center gap-2 translate-y-0";
            } else {
                toast.className = "fixed bottom-5 right-5 bg-red-600 text-white px-6 py-3 rounded-xl shadow-2xl transform opacity-100 transition-all duration-300 flex items-center gap-2 translate-y-0";
            }

            setTimeout(() => {
                toast.className = "fixed bottom-5 right-5 bg-gray-900 text-white px-6 py-3 rounded-xl shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-2";
            }, 3000);
        }
    </script>
</body>
</html>
